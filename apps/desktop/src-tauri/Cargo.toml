# Atlas Flow desktop runtime — thin Tauri shell.
# Orchestration logic lives in the Python backend; this crate manages
# window lifecycle, AG-UI transport and backend process lifecycle.

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Atlas Flow Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default features carry the `wry` runtime. Without it `tauri::Builder` has no
# concrete Runtime to resolve to and the shell does not compile at all.
tauri = { version = "2" }
tauri-build = { version = "2" }

[package]
name = "atlas-flow-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT"

[lib]
name = "atlas_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-shell = "2"
