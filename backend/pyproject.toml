[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-flow"
version = "0.1.0"
description = "Provider-agnostic orchestration runtime for Project Atlas Framework"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0.2,<7.0",
]

[project.scripts]
atlas = "atlas_flow.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.9,<3.0",
    "mypy>=1.15,<2.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.11,<1.0",
    "types-pyyaml>=6.0.12,<7.0",
    "uvicorn>=0.34,<1.0",
    "websockets>=14,<15",
]

[tool.hatch.build.targets.wheel]
packages = ["atlas_flow"]
