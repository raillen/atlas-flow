id: P08-G01
phase: P08
title: Routing, Budgets and Scorecards
state: ACTIVE
objective: Implement role routing, fallbacks, cross-provider policy, budget limits and local
  scorecards.
constraints:
- Follow Project Atlas authority order
- Do not silently weaken acceptance
- Update canonical documentation when behavior/architecture changes
non_goals: []
dependencies:
- P05-G01
- P07-G01
acceptance:
- Runtime model discovery
- Requested three-model roster supported through policy
- Bounded retry/fallback
- Cross-provider reviewer selection when possible
- Why-this-model explanation
- Usage observations update scorecard
gates:
  build: required
  tests: required
  review: required
  documentation: required
evidence: []
history:
- '2026-08-10: reclassified DONE -> ACTIVE after an implementation audit found acceptance
  criteria that are not met.'
- '2026-08-10: unmet — Runtime model discovery: probe_available exists but no caller discovers
  models at runtime.'
- '2026-08-10: unmet — Usage observations update scorecard: the scorecard is never fed from
  real attempts because attempts are not persisted.'
- '2026-08-10: unmet — The router selects model identifiers but no model is ever invoked;
  there is no LLM client in the dependency set.'
- '2026-08-10: closed — Routing decisions are applied per task by the GoalRunner and fed back
  into the scorecard from real attempt outcomes.'
- '2026-08-10: still blocking — No LLM client exists: the router selects model identifiers
  but no model is invoked. Runtime model discovery is still unimplemented.'
- '2026-08-10: still blocking — Budget limits are configured but not enforced during a run.'
- '2026-08-10: still blocking — review gate: no independent review has been performed.'
- '2026-08-10: closed — Runtime model discovery: ModelRegistry probes `cmd --list-models`
  in the background at startup and narrows the router to the models the live registry reports;
  a failed probe degrades to the policy roster instead of failing.'
- '2026-08-10: closed — Bounded retry/fallback: GoalRunner falls back down the role''s candidate
  list, bounded by max_fallback_attempts and by the number of reachable models.'
- '2026-08-10: closed — Cross-provider reviewer selection: high-risk tasks are reviewed by
  a model from another provider before integration; when none is reachable the review gate
  records PENDING rather than passing unreviewed work.'
- '2026-08-10: closed — Budget limits are enforced during a run. The attempt cap is unconditional;
  token and cost ceilings apply to reported usage, and unmeasured spend is reported as unmeasured
  rather than assumed to be zero.'
- '2026-08-10: closed — Usage observations persist in model_observations and reseed the scorecard
  at startup, so routing memory survives a restart.'
- '2026-08-10: closed — Why-this-model explanations are exposed at GET /api/routing and GET
  /api/runs/{id}/routing, and rendered on the Review screen.'
- '2026-08-10: still blocking — review gate: no independent review has been performed.'
