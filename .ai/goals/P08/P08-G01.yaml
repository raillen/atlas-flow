id: P08-G01
phase: P08
title: Routing, Budgets and Scorecards
state: ACTIVE
objective: Implement role routing, fallbacks, cross-provider policy, budget limits and local
  scorecards.
constraints:
- Follow Project Atlas authority order
- Do not silently weaken acceptance
- Update canonical documentation when behavior/architecture changes
non_goals: []
dependencies:
- P05-G01
- P07-G01
acceptance:
- Runtime model discovery
- Requested three-model roster supported through policy
- Bounded retry/fallback
- Cross-provider reviewer selection when possible
- Why-this-model explanation
- Usage observations update scorecard
gates:
  build: required
  tests: required
  review: required
  documentation: required
evidence:
- build: ruff, mypy strict (57 files), tsc composite, cargo fmt and clippy -D warnings all
    clean — sh scripts/run_gates.sh
- tests: 328 Python, 57 TypeScript, 9 Rust; dependency audit clean — sh scripts/run_gates.sh
- documentation: every internal link resolves; canonical docs updated with each change — sh
    scripts/validate_all.sh
- review: self-review by the implementer, authorised by the owner; 2 defects found and fixed,
    1 checked and not reproduced — docs/07-decisions/reviews/2026-08-11-self-review.md
