id: P04-G01
phase: P04
title: Atlas Harness
state: ACTIVE
objective: Implement runner abstraction, ACP client and generic CLI runner.
constraints:
- Follow Project Atlas authority order
- Do not silently weaken acceptance
- Update canonical documentation when behavior/architecture changes
non_goals: []
dependencies:
- P03-G01
acceptance:
- ACP session lifecycle works against fixture agent
- CLI runner supports start/cancel/result capture
- Permissions are surfaced
- Transcripts/events normalized
- Runner capability negotiation works
gates:
  build: required
  tests: required
  review: required
  documentation: required
evidence:
- review: 'FAILED — auditoria independente em 2026-08-11 (revisor não-Opus 5): ACP não retoma
    sessão após reinício (P04-G01 histórico), além de CI Linux-only e validação local bloqueada
    por dependências/execução do ambiente; P04 permanece ACTIVE.'
history:
- '2026-08-10: reclassified DONE -> ACTIVE after an implementation audit found acceptance
  criteria that are not met.'
- '2026-08-10: unmet — ACP session lifecycle works against fixture agent: no ACP implementation
  exists in the codebase.'
- '2026-08-10: unmet — Permissions are surfaced: not implemented.'
- '2026-08-10: unmet — Runner capability negotiation works: capabilities are declared but
  never negotiated against a task''s requirements.'
- '2026-08-10: closed — ACP client implemented over JSON-RPC/stdio with session lifecycle,
  capability negotiation and bidirectional requests.'
- '2026-08-10: closed — Permission requests are surfaced to a policy and denied by default;
  AcpRunner reports denials as task failure.'
- '2026-08-10: closed — Harness negotiates required capabilities and refuses a runner that
  cannot satisfy them.'
- '2026-08-10: still blocking — MCP forwarding through ACP is not implemented.'
- '2026-08-10: still blocking — Terminal and file-event streaming are not implemented.'
- '2026-08-10: still blocking — review gate: no independent review has been performed.'
- '2026-08-10: closed — MCP forwarding: an explicit registry decides which servers each role
  may reach and forwards them in session/new. Planning roles get read-only servers only, literal
  secrets in the config are refused, and what was granted or skipped is recorded as attempt
  evidence.'
- '2026-08-10: closed — Terminal and file events: session/update notifications are normalized
  into a closed vocabulary (message, thought, terminal, file, tool, plan), broadcast over
  AG-UI and rendered on the Build screen. Terminal output lands in the transcript and changed
  files in evidence; unrecognized updates are dropped rather than forwarded untyped.'
- '2026-08-10: closed — Agent-produced text is redacted at the runner boundary, so a token
  an agent echoes never reaches a transcript, an event or a client.'
- '2026-08-10: still blocking — Session resumption across process restarts is not implemented.'
- '2026-08-10: still blocking — review gate: no independent review has been performed.'
- '2026-08-11: review finding closed — gates are reproducible from a clean checkout. scripts/bootstrap.sh
  builds an environment that works even when the checkout is on a noexec mount (which is what
  made the reviewer''s run fail), and scripts/run_gates.sh runs every gate through one command.'
- '2026-08-11: review finding closed — CI is no longer Linux-only: Python, JavaScript and
  the desktop shell run on ubuntu, macOS and Windows.'
- '2026-08-11: review finding closed — dependency auditing added to CI (pip-audit, pnpm audit,
