- '2026-08-11: still blocking — release artefacts are unsigned. Signing needs a key and a
  mechanism the project owner has to choose.'
- '2026-08-11: still blocking — the review gate is FAILED. Closing these findings does not
  reopen it; that takes another independent review.'
- '2026-08-11: review finding closed — ACP session resumption implemented. The session id
  is stored per task and runner, session/load is attempted before session/new, and a stale
