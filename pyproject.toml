# Tooling hub for the Atlas Flow monorepo.
# The Python package lives in backend/ (see backend/pyproject.toml);
# this file centralizes lint/typecheck/test configuration run from the root.

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
strict = true
packages = ["atlas_flow"]
