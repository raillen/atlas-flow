name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-typecheck-test:
    name: Python / lint typecheck test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check ..

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  js-lint-typecheck-test:
    name: JS / lint typecheck test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript composite build
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Vitest
        run: pnpm run test

  project-atlas-validation:
    name: Project Atlas validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --directory backend --locked

      - name: Validate docs
        run: uv run --directory backend python scripts/validate_docs.py

      - name: Validate goals
        run: uv run --directory backend python scripts/validate_goals.py
