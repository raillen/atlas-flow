name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --project backend --locked

      # Task isolation uses real git worktrees, and several tests commit inside
      # them. A runner with no identity configured fails those with a message
      # about who you are, not about what broke.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@atlas-flow.invalid"
          git config --global user.name "Atlas Flow CI"
          git config --global init.defaultBranch main

      # All tool configuration lives in the root pyproject.toml, so every step
      # runs from the repository root. `--project` selects the backend
      # environment without changing the working directory: running these from
      # backend/ makes pytest collect nothing and exit 5.
      - name: Ruff lint
        run: uv run --project backend ruff check .

      - name: Mypy
        run: uv run --project backend mypy

      - name: Pytest
        run: uv run --project backend pytest

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript composite build
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Vitest
        run: pnpm run test

  desktop-shell:
    name: Desktop shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri links against the system webview. Without these the crate cannot
      # be compiled at all, which is how it went a whole phase unbuilt.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
        working-directory: .

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # The frontend build output is a compile-time input to the crate.
      - name: Frontend placeholder
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
        working-directory: .

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The same script a developer runs locally, so a reviewer can reproduce
      # the result instead of taking CI's word for it.
      - name: Audit every ecosystem
        run: sh scripts/audit_dependencies.sh

  project-atlas-validation:
    name: Project Atlas validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --project backend --locked

      # scripts/ lives at the repository root; `--directory backend` would run
      # these from backend/, where the path does not resolve.
      - name: Validate docs
        run: uv run --project backend python scripts/validate_docs.py

      - name: Validate goals
        run: uv run --project backend python scripts/validate_goals.py

      - name: Validate Command Code discoverability
        run: sh scripts/validate_command_code.sh

  packaging:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Signing is skipped, loudly, when no key is configured. A release
      # workflow sets ATLAS_SIGNING_KEY; a pull request does not have it.
      - name: Import the signing key
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Build and verify the bundle
        run: sh scripts/package_smoke.sh
        env:
          ATLAS_PYTHON: python3
          ATLAS_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/sbom.cyclonedx.json
            apps/desktop/src-tauri/target/release/bundle/deb/SHA256SUMS
            apps/desktop/src-tauri/target/release/bundle/deb/SHA256SUMS.asc
