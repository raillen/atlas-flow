name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-typecheck-test:
    name: Python / lint typecheck test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --project backend --locked

      # All tool configuration lives in the root pyproject.toml, so every step
      # runs from the repository root. `--project` selects the backend
      # environment without changing the working directory: running these from
      # backend/ makes pytest collect nothing and exit 5.
      - name: Ruff lint
        run: uv run --project backend ruff check .

      - name: Mypy
        run: uv run --project backend mypy

      - name: Pytest
        run: uv run --project backend pytest

  js-lint-typecheck-test:
    name: JS / lint typecheck test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript composite build
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Vitest
        run: pnpm run test

  desktop-shell:
    name: Desktop shell / fmt clippy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri links against the system webview; without these the crate cannot
      # be compiled at all, which is how it went unbuilt for a whole phase.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # The frontend build output is a compile-time input to the crate.
      - name: Frontend placeholder
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html

      - name: Rustfmt
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  project-atlas-validation:
    name: Project Atlas validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --project backend --locked

      # scripts/ lives at the repository root; `--directory backend` would run
      # these from backend/, where the path does not resolve.
      - name: Validate docs
        run: uv run --project backend python scripts/validate_docs.py

      - name: Validate goals
        run: uv run --project backend python scripts/validate_goals.py

      - name: Validate Command Code discoverability
        run: sh scripts/validate_command_code.sh
